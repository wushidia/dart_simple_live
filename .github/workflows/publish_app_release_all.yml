name: app-build-release-all

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, for example master or v1.13.0"
        required: false
        default: "master"
      upload_release:
        description: "Upload packages to the matching v* GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Android signing secrets are required." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > simple_live_app/android/release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > simple_live_app/android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Android APKs
        shell: bash
        run: |
          cd simple_live_app
          flutter pub get
          flutter build apk --release --split-per-abi
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/release/SimpleLive-v${version}-arm64-v8a-release.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "build/release/SimpleLive-v${version}-armeabi-v7a-release.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "build/release/SimpleLive-v${version}-x86_64-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: simple_live_app/build/release/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build unsigned IPA
        shell: bash
        run: |
          cd simple_live_app
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ios_no_sign.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows ZIP
        shell: bash
        run: |
          cd simple_live_app
          flutter config --enable-windows-desktop
          flutter pub get
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets zip --skip-clean
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p build/release
          cp build/dist/*/*.zip "build/release/SimpleLive-Windows-v${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: simple_live_app/build/release/*.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Build Linux packages
        shell: bash
        run: |
          cd simple_live_app
          flutter config --enable-linux-desktop
          flutter pub get
          dart pub global activate flutter_distributor
          flutter_distributor package --platform linux --targets deb,zip --skip-clean
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS packages
        shell: bash
        run: |
          cd simple_live_app
          flutter config --enable-macos-desktop
          flutter pub get
          npm install -g appdmg
          dart pub global activate flutter_distributor
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

  publish:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true && startsWith(inputs.ref, 'v')) }}
    needs: [build-android, build-ios, build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.ref }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          token: ${{ github.token }}
          files: release-assets/**/*
